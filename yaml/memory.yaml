###########################################################
## This file has the configuration for
## - A namespace called 0-eldada for isolation
## - A pod on Ubuntu 26.04 LTS. curl and vim are installed at startup, then the
##   container runs a script that holds a block of memory for a given time with
##   an optional gap between memory block runs.
##   The container runs as root so apt can install those packages. It is not privileged.
##
## Deploy: kubectl apply -f memory.yaml
## Update (force replacing with new config): kubectl replace --force -f memory.yaml
## Terminal access: kubectl exec -it pod-memory -- bash
## Remove: kubectl delete -f memory.yaml
##
## SECURITY: The container installs packages and downloads a script at startup. The URL is pinned to a commit so it
##           can't change under you. Review the script before updating the commit.
###########################################################
apiVersion: v1
kind: Namespace
metadata:
  name: 0-eldada
---
apiVersion: v1
kind: Pod
metadata:
  name: pod-memory
  namespace: 0-eldada
spec:
  terminationGracePeriodSeconds: 5
  securityContext:
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: container-memory
      image: ubuntu:26.04
      workingDir: /tmp
      command:
        - 'bash'
        - '-c'
        - >
          set -e;
          echo "#######################################";
          echo "### Installing curl and vim";
          export DEBIAN_FRONTEND=noninteractive;
          apt-get update;
          apt-get install -y --no-install-recommends ca-certificates curl vim;
          echo "### Downloading memory.sh";
          curl -fL -sS -o /tmp/memory.sh https://raw.githubusercontent.com/eldada/command-examples/e702712a0b2c80ff78ac8d0640d8cc3962ba4c2e/scripts/memory.sh;
          echo "### Running memory.sh";
          bash /tmp/memory.sh --mb ${MEMORY_TO_USE_MB} --wait ${TIME_TO_HOLD} --restart ${RESTART} --gap ${GAP};
          echo "Sleeping forever...";
          while true; do date; sleep 10; done
      env:
        ## Actual memory used in the container will be MEMORY_TO_USE_MB + other system processes
        - name: MEMORY_TO_USE_MB
          value: "500"
        - name: TIME_TO_HOLD
          value: "60"
        - name: RESTART
          value: "true"
        - name: GAP
          value: "45"
## WARNING: Need to set a limit twice as much as the required memory (MEMORY_TO_USE_MB) to avoid an OOMKill.
##          This is due to a spike in memory usage during the actual creation of the memory blob.
#      resources:
#        limits:
#          cpu: "2"
#          memory: 2000Mi
#        requests:
#          cpu: 5m
#          memory: 50Mi
